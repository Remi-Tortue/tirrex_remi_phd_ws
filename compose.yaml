services:
  compile:  # compile the workspace
    extends:
      file: docker/common.yaml
      service: build
    command: >-
      colcon --log-base /dev/null build
        --symlink-install
        --event-handlers event_log- log-
        --continue-on-error

  bash:
    extends:
      file: docker/common.yaml
      service: x11_gpu
    profiles: [optional]
    volumes:
      - ./docker/bash_extra_env.sh:/bash_extra_env.sh:ro
    command: ["/bash_extra_env.sh"]

  dev:  # start a container used by IDEs like VS-code
    extends:
      file: docker/common.yaml
      service: x11_base
    command: sleep infinity

